  archetype: strategy-roadmap
  visual_style: narrative
  density: standard
  tone: professional
  emphasis: visual-first
  evidence_level: sourced
  page_geometry: landscape
  rationale: "A roadmap benefits from a clear sequence, visible ownership, and a small set of measurable outcomes."
  signals:
    - explicit: strategy-roadmap template
