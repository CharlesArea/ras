<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RAS report pipeline</title>
  <desc id="desc">A four-step pipeline from request and evidence to a designed report and quality receipt.</desc>
  <rect width="1200" height="280" rx="20" fill="#F5F8FA"/>
  <path d="M0 20C0 8.954 8.954 0 20 0H1180C1191.046 0 1200 8.954 1200 20V32H0V20Z" fill="#117A8B"/>
  <text x="56" y="88" fill="#17202A" font-family="Arial, sans-serif" font-size="22" font-weight="700">One request. One canonical model. Two polished outputs.</text>
  <text x="56" y="116" fill="#5D6B78" font-family="Arial, sans-serif" font-size="14">RAS keeps evidence, design, rendering, and QA connected from the first prompt to the final page.</text>

  <g font-family="Arial, sans-serif">
    <rect x="56" y="158" width="220" height="72" rx="12" fill="#FFFFFF" stroke="#C8D6DD"/>
    <circle cx="82" cy="194" r="16" fill="#117A8B"/>
    <text x="82" y="199" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">01</text>
    <text x="112" y="188" fill="#17202A" font-size="15" font-weight="700">Request + evidence</text>
    <text x="112" y="208" fill="#5D6B78" font-size="12">notes, files, research</text>

    <path d="M294 194H330" stroke="#117A8B" stroke-width="2"/>
    <path d="M324 187L334 194L324 201" stroke="#117A8B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="350" y="158" width="220" height="72" rx="12" fill="#FFFFFF" stroke="#C8D6DD"/>
    <circle cx="376" cy="194" r="16" fill="#117A8B"/>
    <text x="376" y="199" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">02</text>
    <text x="406" y="188" fill="#17202A" font-size="15" font-weight="700">Canonical model</text>
    <text x="406" y="208" fill="#5D6B78" font-size="12">blocks, sources, design</text>

    <path d="M588 194H624" stroke="#117A8B" stroke-width="2"/>
    <path d="M618 187L628 194L618 201" stroke="#117A8B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="644" y="158" width="220" height="72" rx="12" fill="#FFFFFF" stroke="#C8D6DD"/>
    <circle cx="670" cy="194" r="16" fill="#117A8B"/>
    <text x="670" y="199" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">03</text>
    <text x="700" y="188" fill="#17202A" font-size="15" font-weight="700">Designed outputs</text>
    <text x="700" y="208" fill="#5D6B78" font-size="12">DOCX + PDF, same system</text>

    <path d="M882 194H918" stroke="#117A8B" stroke-width="2"/>
    <path d="M912 187L922 194L912 201" stroke="#117A8B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="938" y="158" width="206" height="72" rx="12" fill="#E1F3F5" stroke="#117A8B"/>
    <circle cx="964" cy="194" r="16" fill="#117A8B"/>
    <text x="964" y="199" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">04</text>
    <text x="994" y="188" fill="#17202A" font-size="15" font-weight="700">QA receipt</text>
    <text x="994" y="208" fill="#5D6B78" font-size="12">pages, sources, visuals</text>
  </g>
</svg>
